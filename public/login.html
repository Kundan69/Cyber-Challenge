<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | Cyber Challenge India</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="admin-body">
    <main class="login-shell">
      <form class="login-card" data-login-form>
        <a class="brand" href="/">
          <span class="brand-mark image-brand"><img src="/assets/cyberlogo.svg" alt="Cyber Challenge India logo"></span>
          <span>
            <strong>Admin Access</strong>
            <small>Private CMS dashboard</small>
          </span>
        </a>
        <div>
          <p class="section-kicker">Secure Area</p>
          <h1>CMS Login</h1>
          <p>Only admins can update content and view registration records.</p>
        </div>
        <label>
          Admin ID
          <input name="username" autocomplete="username" value="admin" required>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">Login</button>
        <p class="form-status" data-login-status role="status"></p>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
